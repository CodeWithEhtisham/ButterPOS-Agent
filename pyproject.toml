[project]
name = "butterpos-agent"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "spikes", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"spikes/**" = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
