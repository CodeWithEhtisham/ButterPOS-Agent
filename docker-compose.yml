# Local / staging infrastructure — Step 0.5
# Usage: docker compose up -d
# Verify: python scripts/check_infra.py

services:
  postgres:
    image: postgres:15-alpine
    container_name: butterpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-butterpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-butterpos}
      POSTGRES_DB: ${POSTGRES_DB:-butterpos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-butterpos} -d ${POSTGRES_DB:-butterpos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: butterpos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
